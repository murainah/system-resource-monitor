[project]
name = "system-resource-monitor"
version = "0.3.0"
description = "A Python command-line tool for monitoring CPU, memory, and disk usage."
authors = [
    {name = "Abubakri Murainah", email = "ext.a.murainah@etu.emse.fr"}
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["monitoring", "cli", "cpu", "memory", "disk", "psutil"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil (>=7.2.2,<8.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pandas (>=3.1.0,<4.0.0)"
]

[project.urls]
Repository = "https://github.com/murainah/system-resource-monitor"
Issues = "https://github.com/murainah/system-resource-monitor/issues"

[project.scripts]
system-monitor = "system_resource_monitor.cli:main"

[tool.poetry]
packages = [{include = "system_resource_monitor", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]